[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "content-intelligence-engine"
version = "0.1.0"
description = "Domain-independent AI content intelligence and production engine"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27,<1",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.7,<3",
    "playwright>=1.50,<2",
    "rich>=13.9,<15",
    "beautifulsoup4>=4.12,<5",
    "seleniumbase>=4.34,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
    "pytest-asyncio>=1,<2",
]

[project.scripts]
content-intelligence-engine = "intelligence_content_engine.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]
