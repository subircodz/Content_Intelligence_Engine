name: Power.win Content Intelligence Report

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  models: read

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [telugu, tamil, kannada, malayalam]
    env:
      TARGET_BRAND: Power.win
      TARGET_DOMAIN: power.win
      LLM_BASE_URL: https://models.github.ai/inference
      LLM_MODEL: openai/gpt-4o
      LLM_API_KEY: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install chromium
      - name: Generate report
        run: |
          python -m intelligence_content_engine.main             --target-domain "power.win"             --target-brand "Power.win"             --language "${{ matrix.language }}"             "crypto casino"
      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: powerwin-crypto-casino-${{ matrix.language }}
          path: output/*.docx
          if-no-files-found: error
