name: Power.win Content Intelligence Report

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [telugu, tamil, kannada, malayalam]
    env:
      TARGET_BRAND: Power.win
      TARGET_DOMAIN: power.win
      LLM_BASE_URL: http://127.0.0.1:11434/v1
      LLM_MODEL: qwen2.5:0.5b
      LLM_API_KEY: ollama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install chromium
      - name: Start local LLM
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:0.5b
      - name: Generate report
        run: |
          python -m intelligence_content_engine.main \
            --target-domain "power.win" \
            --target-brand "Power.win" \
            --first-party-sitemap "https://power.win/sitemap.xml" \
            --language "${{ matrix.language }}" \
            --max-competitors 2 \
            "crypto casino"
      - name: Validate generated report
        run: |
          test -n "$(find output -maxdepth 1 -type f -name '*.docx' -print -quit)"
      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: powerwin-crypto-casino-${{ matrix.language }}
          path: output/*.docx
          if-no-files-found: error
